# coord config — 2026-04-26T18:00:12+09:00 생성됨
# 수정 가능; subs[] 추가/제거 가능

project:
  name: sena

git:
  work_branch: crew
  stable_branch: main
  remote: origin

subs:
  - name: db
    port: 3001
    model: claude-sonnet-4-6
    scope_allowed:
      - "db/**"
      # 프로젝트별 추가 (예: supabase/**, lib/db/**, types/db.ts)
    validation: "echo 'add validation cmd'"

  - name: backend
    port: 3002
    model: claude-opus-4-7
    scope_allowed:
      - "src/**"
      # 프로젝트별 추가 (예: core/**, utils/**)
    validation: "echo 'add validation cmd'"

  - name: frontend
    port: 3003
    model: claude-sonnet-4-6
    scope_allowed:
      - "app/**"
      - "components/**"
      # 프로젝트별 추가 (예: hooks/**, stores/**)
    validation: "echo 'add validation cmd'"

head:
  port: 3099
  model: claude-opus-4-7
  branch: wt/head

op:
  port: 3000

notifications:
  discord_webhook_env: DISCORD_WEBHOOK_URL
  token_thresholds: [10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 96, 97, 98, 99]
  weekly_reset_day: monday
  weekly_reset_hour_kst: 0

token_budget:
  weekly_limit: 5000000

judiciary:
  enabled: true
  judge_model: claude-sonnet-4-6
  approval_ttl_minutes: 1440

dashboard:
  enabled: true
  port: 8888
  external: trycloudflare

merge:
  to_work_branch: auto
  to_stable_branch: manual
