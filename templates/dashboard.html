<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ data.project_name }} Coordination Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif; }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-white px-4 sm:px-6 py-3 sticky top-0 z-10 shadow">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🎯</span>
        <h1 class="text-base sm:text-lg font-bold">{{ data.project_name }} Coordination</h1>
      </div>
      <div class="text-xs text-slate-300">
        <span id="last-update">{{ data.now }}</span>
        <span class="ml-2 inline-block w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-6 py-4 space-y-4"
        hx-get="/partials/main"
        hx-trigger="every 5s"
        hx-swap="innerHTML">
    {% include "partials/main.html" %}
  </main>

  <footer class="text-center text-xs text-slate-500 py-4">
    Auto-refresh 5s · <a href="/api/status" class="underline">JSON API</a>
  </footer>

  <script>
    // 마지막 갱신 시각 표시 (HTMX 가 main 갱신할 때마다)
    document.body.addEventListener('htmx:afterSwap', () => {
      const ts = document.getElementById('partial-now')?.textContent;
      if (ts) document.getElementById('last-update').textContent = ts;
    });
  </script>
</body>
</html>
